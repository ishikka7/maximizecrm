<nav class="app-nav">
  <div class="brand"><span class="brand-icon">R</span> RetailMax CRM</div>
  <div class="tabs">
    <button class="tab-btn" [class.active]="tab() === 'leads'" (click)="tab.set('leads')">Leads</button>
    <button class="tab-btn" [class.active]="tab() === 'pipeline'" (click)="tab.set('pipeline')">Pipeline</button>
    <button class="tab-btn" [class.active]="tab() === 'customers'" (click)="tab.set('customers')">Customers</button>
    <button class="tab-btn" [class.active]="tab() === 'campaigns'" (click)="tab.set('campaigns')">Campaigns</button>
  </div>
</nav>

@if (tab() === 'leads') {
  <app-dashboard #dash />
  <app-lead-list (changed)="dash.refresh()" />
}
@if (tab() === 'pipeline') { <app-pipeline /> }
@if (tab() === 'customers') { <app-customers /> }
@if (tab() === 'campaigns') { <app-campaigns /> }
